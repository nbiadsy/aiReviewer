name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff origin/${{ github.event.pull_request.base.ref }} > pr_diff.txt

      - name: Send Diff to OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4-turbo",
              "messages": [
                {"role": "system", "content": "You are a senior code reviewer. Give suggestions on improvements, security, and best practices."},
                {"role": "user", "content": "'"$(cat pr_diff.txt)"'"}
              ]
            }')

          echo "$RESPONSE" > ai_feedback.json

      - name: Post AI Review to PR
        run: |
          COMMENT=$(jq -r '.choices[0].message.content' ai_feedback.json)
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
