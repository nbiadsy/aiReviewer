name: Java Code Review

on:
  pull_request:
    paths:
      - '**.java'  # Runs only if Java files are changed

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensures we have full commit history

      - name: Get Changed Java Files
        id: changed_files
        run: |
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} | grep '\.java$' || echo "")
          if [ -z "$FILES" ]; then
            echo "No Java files changed. Skipping review."
            echo "files_changed=false" >> "$GITHUB_ENV"
          else
            echo "files_changed=true" >> "$GITHUB_ENV"
            echo "$FILES" > changed_files.txt
          fi

      - name: Read Java Files Content
        if: env.files_changed == 'true'
        run: |
          echo "Gathering Java code for review..."
          REVIEW_CONTENT=""
          while IFS= read -r FILE; do
            CONTENT=$(head -c 5000 "$FILE")  # Limit to 5000 characters
            ESCAPED_CONTENT=$(jq -Rs . <<< "$CONTENT")  # Ensures valid JSON formatting
            REVIEW_CONTENT+="{\"type\": \"text\", \"text\": \"### File: $FILE\n\`\`\`java\n$CONTENT\n\`\`\`\"},"
          done < changed_files.txt

          REVIEW_CONTENT="[${REVIEW_CONTENT%,}]"  # Remove trailing comma and wrap in array
          echo "$REVIEW_CONTENT" > review_content.json

      - name: Call OpenAI API for Code Review
        if: env.files_changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Calling OpenAI API for code review..."
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n --argjson reviewContent "$(cat review_content.json)" '{
              "model": "gpt-4-turbo",
              "messages": [
                {
                  "role": "system",
                  "content": [
                    {"type": "text", "text": "You are an expert Java developer. Review the following Java code for correctness, efficiency, security vulnerabilities, and best practices. Provide specific, actionable feedback."}
                  ]
                },
                {
                  "role": "user",
                  "content": $reviewContent
                }
              ]
            }')"
          )

          echo "🔍 Full API Response: $RESPONSE"  # Debugging output
          echo "$RESPONSE" > response.json

          REVIEW_OUTPUT=$(jq -r '.choices[0].message.content // "Error: No response from OpenAI."' response.json)
          echo "REVIEW_RESPONSE=$REVIEW_OUTPUT" >> "$GITHUB_ENV"

      - name: Debug OpenAI API Response
        if: env.files_changed == 'true'
        run: cat response.json || echo "No response.json file found"

      - name: Post Review as PR Comment
        if: env.files_changed == 'true'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ## 🤖 AI Code Review
            ${{ env.REVIEW_RESPONSE }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
