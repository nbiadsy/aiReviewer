name: AI PR Review
on: [pull_request]
jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run AI Review
        run: |
          curl -X POST "https://api.openai.com/v1/completions" \
          -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "gpt-4",
            "prompt": "Review this Java code for best practices and security issues:\n\n$(cat src/**/*.java)",
            "max_tokens": 500
          }'
