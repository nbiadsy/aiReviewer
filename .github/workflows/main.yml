name: Java Code Review on PR

on:
  pull_request:
    paths:
      - '**.java'  # Runs when Java files are modified in a PR

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensures we have full commit history

      - name: Find Changed Java Files
        id: changed_files
        run: |
          BASE_BRANCH=${{ github.event.pull_request.base.ref }}
          echo "Comparing against base branch: $BASE_BRANCH"
          FILES=$(git diff --name-only origin/$BASE_BRANCH | grep '\.java$' || echo "")
          if [ -z "$FILES" ]; then
            echo "No Java files changed. Skipping review."
            exit 0
          fi
          echo "FILES=$FILES" >> $GITHUB_ENV

      - name: Read Java Files Content
        run: |
          REVIEW_CONTENT=""
          for FILE in $FILES; do
            CONTENT=$(cat "$FILE" | jq -R -s .)
            REVIEW_CONTENT+="\n\n### File: $FILE\n\`\`\`java\n$CONTENT\n\`\`\`"
          done
          echo "REVIEW_CONTENT=$REVIEW_CONTENT" >> $GITHUB_ENV

      - name: Call OpenAI API for Code Review
        id: ai_review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-4-turbo",
              "messages": [
                {
                  "role": "system",
                  "content": "You are an expert Java developer. Review the following Java code for correctness, performance, security vulnerabilities, and best practices."
                },
                {
                  "role": "user",
                  "content": "Please review the following Java code:\n\n'"$REVIEW_CONTENT"'"
                }
              ]
            }' | jq -r '.choices')

          echo "REVIEW_RESPONSE=$RESPONSE" >> $GITHUB_ENV

      - name: Post Review as PR Comment
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ## 🧐 AI Code Review
            ${{ env.REVIEW_RESPONSE }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
